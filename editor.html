<!doctype html>
<meta charset="utf-8">
<style>
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#181122;color:#eee;margin:0;padding:18px}
  h3{margin:18px 0 8px} input,textarea{width:100%;box-sizing:border-box;background:#22222b;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;font:inherit;margin-bottom:8px}
  textarea{height:300px;font-family:Consolas,monospace} button{background:#aaff00;color:#000;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;margin-right:8px}
  button.g{background:#333;color:#eee} small{opacity:.6;display:block;margin-bottom:8px} #ok{color:#aaff00}
</style>
<h3>Lyrics for current song</h3>
<input id="artist" placeholder="Artist"><input id="title" placeholder="Title">
<textarea id="text" placeholder="Paste lyrics here, or use the Upload icon to import a timed subtitle file."></textarea>
<small>Timestamped lyrics sweep in sync. Plain lyrics are shown as scrollable text. Saving empty text removes your custom lyrics.</small>
<button id="save">Save lyrics</button><span id="ok"></span>
<h3>Spotify</h3>
<input id="cid" placeholder="Spotify Client ID">
<small>Redirect URI to register in your Spotify app: http://127.0.0.1:8888/callback</small>
<button id="cs" class="g">Save Client ID</button><button id="cn">Connect Spotify</button>
<script>
const $ = id => document.getElementById(id);
function fill(s) {
  $('artist').value = s.track?.artist ?? '';
  $('title').value = s.track?.title ?? '';
  $('text').value = s.text;
  if (s.clientId != null) $('cid').value = s.clientId;
}
api.invoke('editor:init').then(fill);
api.on('editor:import', fill);
$('save').onclick = async () => {
  if (!$('artist').value.trim() || !$('title').value.trim()) {
    $('ok').textContent = 'Enter the artist and title first.';
    return;
  }
  try {
    await api.invoke('editor:save', { artist: $('artist').value, title: $('title').value, text: $('text').value });
    $('ok').textContent = 'Saved ✓';
  } catch {
    $('ok').textContent = 'Could not save the lyrics.';
  }
};
$('cs').onclick = () => api.invoke('editor:clientId', $('cid').value);
$('cn').onclick = async () => { await api.invoke('editor:clientId', $('cid').value); api.invoke('editor:connect'); };
</script>
