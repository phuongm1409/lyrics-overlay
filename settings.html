<!doctype html>
<meta charset="utf-8">
<title>Lyrics Overlay Settings</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { font: 13px 'Segoe UI', system-ui, sans-serif; background: #181122; color: #f5eefc;
    margin: 0; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; }
  .tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid #3a2d48;
    background: #20162c; border-radius: 10px; }
  button { font: inherit; font-weight: 600; color: #f5eefc; background: #332640;
    border: 0; border-radius: 7px; padding: 8px 11px; cursor: pointer; }
  button.primary { background: #aaff00; color: #202817; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #aaff00; outline-offset: 2px; }
  [role=tab] { flex: 1; white-space: nowrap; background: transparent; color: #cabcd8; }
  [role=tab][aria-selected=true] { color: #aaff00; background: #352643; }
  #panels { flex: 1; margin: 13px 0; }
  [role=tabpanel] { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; align-content: start; }
  .group { border: 1px solid #3a2d48; background: #21172c; padding: 10px 12px; border-radius: 9px; min-width: 0; }
  #panel-text .group, #panel-playback .group, #panel-drive .group, #panel-appearance .group:last-child { grid-column: 1 / -1; }
  h2 { font-size: 13px; margin: 0 0 6px; color: #c9fa81; }
  .row { display: flex; min-height: 29px; align-items: center; justify-content: space-between; gap: 7px; }
  .row input[type=range] { flex: 1; min-width: 44px; margin: 0; max-width: 160px; }
  .row select { background: #2d203a; color: #f5eefc; border: 1px solid #4b3a59; padding: 3px 6px; border-radius: 6px; min-width: 44%; }
  input { accent-color: #aaff00; }
  input[type=color] { width: 37px; height: 23px; border: 0; background: transparent; padding: 0; }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; }
  .value { color: #cabcd8; min-width: 31px; text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }
  footer { border-top: 1px solid #3a2d48; padding-top: 11px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  #drive-status, #drive-help { overflow-wrap: anywhere; margin: 7px 0 11px; line-height: 1.45; }
  #drive-help { color: #cabcd8; }
  [hidden] { display: none !important; }
</style>
<div class="tabs" role="tablist" aria-label="Settings">
  <button id="tab-text" role="tab" aria-selected="true" aria-controls="panel-text">Text</button>
  <button id="tab-appearance" role="tab" aria-selected="false" aria-controls="panel-appearance" tabindex="-1">Appearance</button>
  <button id="tab-playback" role="tab" aria-selected="false" aria-controls="panel-playback" tabindex="-1">Playback</button>
  <button id="tab-drive" role="tab" aria-selected="false" aria-controls="panel-drive" tabindex="-1">Google Drive</button>
</div>
<div id="panels">
  <section id="panel-text" role="tabpanel" aria-labelledby="tab-text"></section>
  <section id="panel-appearance" role="tabpanel" aria-labelledby="tab-appearance" hidden></section>
  <section id="panel-playback" role="tabpanel" aria-labelledby="tab-playback" hidden></section>
  <section id="panel-drive" role="tabpanel" aria-labelledby="tab-drive" hidden>
    <div class="group">
      <h2>Google Drive</h2>
      <p id="drive-status" role="status">Checking Google Drive…</p>
      <p id="drive-help">Sign in to sync your lyrics and original subtitle files.</p>
      <div class="actions">
        <button id="google-sign-in" class="primary">Sign in with Google</button>
        <button id="google-configure">Load OAuth file</button>
        <button id="google-sync" class="primary" hidden>Sync now</button>
        <button id="google-folder" hidden>Open Drive folder</button>
        <button id="google-disconnect" hidden>Disconnect</button>
      </div>
    </div>
  </section>
</div>
<footer class="actions">
  <button id="pv" class="primary">Preview lyrics</button>
  <button id="rs">Reset to defaults</button>
  <button id="ed">Lyrics editor / Spotify setup</button>
</footer>
<script>
const FONTS = ['Segoe UI','Lexend Deca','Arial','Verdana','Trebuchet MS','Georgia','Times New Roman','Consolas','Impact','Comic Sans MS'].map(x => [x, x]);
const F = [
  ['Text'],
  ['fontSize', 'Font size', 'range', 16, 64, 1, 'px'],
  ['fontWeight', 'Boldness', 'select', [[400, 'Regular'], [600, 'Semi-bold'], [700, 'Bold'], [800, 'Extra bold'], [900, 'Black']]],
  ['fontFamily', 'Font', 'select', FONTS],
  ['fontStyle', 'Style', 'select', [['normal', 'Normal'], ['italic', 'Italic']]],
  ['align', 'Alignment', 'select', [['left', 'Left'], ['center', 'Center'], ['right', 'Right']]],
  ['Colors'],
  ['sweepColor', 'Sweep highlight', 'color'],
  ['textColor', 'Other lines', 'color'],
  ['dimOpacity', 'Other lines visibility', 'range', 10, 100, 1, '%'],
  ['Shadow'],
  ['shadowColor', 'Shadow color', 'color'],
  ['shadowBlur', 'Shadow size', 'range', 0, 30, 1, 'px'],
  ['shadowOpacity', 'Shadow strength', 'range', 0, 100, 1, '%'],
  ['Background'],
  ['bgColor', 'Color', 'color'],
  ['bgOpacity', 'Background opacity', 'range', 0, 100, 1, '%'],
  ['radius', 'Corner roundness', 'range', 0, 40, 1, 'px'],
  ['Visibility'],
  ['showTrack', 'Track and artist', 'checkbox'],
  ['showSource', 'Lyrics source', 'checkbox'],
  ['showPrevious', 'Previous lyric', 'checkbox'],
  ['showNext', 'Next lyric', 'checkbox'],
  ['showProgress', 'Playback progress', 'checkbox'],
  ['showStatus', 'Status messages', 'checkbox'],
  ['Timing'],
  ['syncOffset', 'Sync offset', 'range', -5000, 5000, 250, ' ms']
];
const groupPanels = {
  Text: 'text', Colors: 'appearance', Shadow: 'appearance',
  Background: 'appearance', Visibility: 'playback', Timing: 'playback'
};
function render(vals) {
  for (const id of ['text', 'appearance', 'playback']) byId('panel-' + id).replaceChildren();
  let group;
  for (const [k, label, type, a, b, step, unit] of F) {
    if (!label) {
      group = document.createElement('div');
      group.className = 'group';
      const heading = document.createElement('h2');
      heading.textContent = k === 'Text' ? 'Typography' : k;
      group.appendChild(heading);
      byId('panel-' + groupPanels[k]).appendChild(group);
      continue;
    }
    const row = document.createElement('div');
    row.className = 'row';
    const title = document.createElement('label');
    title.textContent = label;
    title.htmlFor = k;
    row.appendChild(title);
    const input = document.createElement(type === 'select' ? 'select' : 'input');
    if (type === 'select') {
      for (const [value, name] of a) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = name;
        input.appendChild(option);
      }
    } else {
      input.type = type;
      if (type === 'range') { input.min = a; input.max = b; input.step = step; }
    }
    input.id = k;
    if (type === 'checkbox') input.checked = vals[k]; else input.value = vals[k];
    row.appendChild(input);
    const output = type === 'range' ? document.createElement('span') : null;
    if (output) {
      output.className = 'value';
      output.textContent = vals[k] + unit;
      row.appendChild(output);
    }
    input.addEventListener('input', () => {
      if (output) output.textContent = input.value + unit;
      api.invoke('settings:set', { [k]: type === 'checkbox' ? input.checked : output ? Number(input.value) : input.value });
    });
    group.appendChild(row);
  }
}
const tabs = [...document.querySelectorAll('[role=tab]')];
function selectTab(active) {
  for (const tab of tabs) {
    const selected = tab === active;
    tab.setAttribute('aria-selected', String(selected));
    tab.tabIndex = selected ? 0 : -1;
    byId(tab.getAttribute('aria-controls')).hidden = !selected;
  }
}
tabs.forEach((tab, index) => {
  tab.addEventListener('click', () => selectTab(tab));
  tab.addEventListener('keydown', event => {
    const next = { ArrowLeft: (index + tabs.length - 1) % tabs.length, ArrowRight: (index + 1) % tabs.length,
      Home: 0, End: tabs.length - 1 }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    selectTab(tabs[next]);
    tabs[next].focus();
  });
});
const driveButtons = {
  'google-sign-in': 'google:sign-in', 'google-configure': 'google:configure',
  'google-sync': 'google:sync', 'google-folder': 'google:open-folder', 'google-disconnect': 'google:disconnect'
};
const byId = id => document.getElementById(id);
function showDrive(state) {
  byId('drive-status').textContent = [state.email, state.message || (state.email ? 'Connected.' : 'Disconnected.')].filter(Boolean).join(' · ');
  byId('drive-help').textContent = state.email
    ? (state.lastSynced ? 'Last synced ' + new Date(state.lastSynced).toLocaleString() : 'Local lyrics are available offline.')
    : state.configured ? 'Sign in to sync this device’s lyrics and original subtitles with the Google account you choose.'
    : 'Sign in to sync this device’s library. Choose your Google Desktop OAuth JSON when prompted.';
  for (const id of Object.keys(driveButtons)) byId(id).disabled = state.busy;
  byId('google-sign-in').hidden = byId('google-configure').hidden = !!state.email;
  byId('google-sync').hidden = byId('google-disconnect').hidden = !state.email;
  byId('google-folder').hidden = !state.folder;
}
for (const [id, action] of Object.entries(driveButtons)) {
  byId(id).onclick = () => api.invoke(action).catch(error => {
    byId('drive-status').textContent = error.message.replace(/^Error invoking remote method '[^']+': Error: /, '');
  });
}
api.on('google:state', showDrive);
api.invoke('google:state').then(showDrive);
api.invoke('settings:get').then(render);
document.getElementById('rs').onclick = () => api.invoke('settings:reset').then(render);
document.getElementById('ed').onclick = () => api.invoke('editor:open');
document.getElementById('pv').onclick = () => api.invoke('settings:preview');
</script>
