<!doctype html>
<meta charset="utf-8">
<style>
  :root{--fs:34px;--fw:900;--ff:'Segoe UI';--fst:normal;--align:center;--origin:center;--c:#fff;--ca:#fff;--dim:.4;--near:.65;
        --shadow:0 0 6px #000,0 2px 10px #000;--bg:rgba(10,10,14,.28);--radius:18px}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:var(--ff),'Segoe UI',system-ui,sans-serif;color:#fff}
  #box{position:relative;height:100%;box-sizing:border-box;background:var(--bg);border-radius:var(--radius)}
  body.unlocked #box{-webkit-app-region:drag;outline:2px dashed rgba(255,255,255,.45)}
  #meta{position:absolute;top:8px;left:18px;right:18px;font-size:12px;font-weight:600;color:#fff;opacity:.75;text-shadow:0 1px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
  #view{position:absolute;inset:26px 20px 8px;overflow:hidden;
    -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
  #list{transition:transform .5s cubic-bezier(.22,.8,.25,1);will-change:transform}
  .ln{text-align:var(--align);font-size:var(--fs);font-weight:var(--fw);font-style:var(--fst);color:var(--c);line-height:1.2;padding:8px 10px;
      opacity:var(--dim);transform:scale(.8);transform-origin:var(--origin) center;transition:opacity .35s,transform .35s;text-shadow:var(--shadow)}
  .ln.near{opacity:var(--near)}
  .ln.cur{opacity:1;transform:scale(1);color:var(--ca)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 30px;font-size:calc(var(--fs)*.7);font-weight:var(--fw);color:var(--ca);text-shadow:var(--shadow)}
  #plain{position:absolute;inset:26px 20px 8px;white-space:pre-wrap;overflow:auto;text-align:var(--align);font-size:calc(var(--fs)*.7);font-weight:var(--fw);font-style:var(--fst);color:var(--ca);line-height:1.4;text-shadow:var(--shadow);display:none;-webkit-app-region:no-drag}
</style>
<div id="box">
  <div id="meta"></div>
  <div id="view"><div id="list"></div></div>
  <div id="plain"></div>
  <div id="msg"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let lines = [], els = [], base = 0, at = 0, playing = false, off = 0, last = -2;

function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function apply(s) {
  const set = (k, v) => document.documentElement.style.setProperty(k, v);
  set('--fs', s.fontSize + 'px'); set('--fw', s.fontWeight); set('--ff', `'${s.fontFamily}'`); set('--fst', s.fontStyle);
  set('--align', s.align); set('--origin', s.align); set('--c', s.textColor); set('--ca', s.activeColor);
  set('--dim', s.dimOpacity / 100); set('--near', Math.min(1, s.dimOpacity / 100 + .25));
  const b = +s.shadowBlur, c = rgba(s.shadowColor, s.shadowOpacity / 100);
  set('--shadow', b > 0 && s.shadowOpacity > 0 ? `0 0 ${b * .6}px ${c},0 2px ${b}px ${c},0 0 ${b * 1.8}px ${c}` : 'none');
  set('--bg', rgba(s.bgColor, s.bgOpacity / 100)); set('--radius', s.radius + 'px');
  requestAnimationFrame(() => { if (lines.length) focusLine(Math.max(last, -1)); });
}
api.invoke('settings:get').then(apply);
api.on('settings', apply);

function showMsg(text) { $('msg').textContent = text; $('msg').style.display = text ? 'flex' : 'none'; }
function reset() { lines = []; els = []; last = -2; $('list').innerHTML = ''; $('plain').style.display = 'none'; $('plain').textContent = ''; }
function build() {
  const list = $('list'); list.innerHTML = '';
  els = lines.map(l => { const d = document.createElement('div'); d.className = 'ln'; d.textContent = l.text || '♪'; list.appendChild(d); return d; });
}
function focusLine(i) {
  const c = Math.max(i, 0);
  els.forEach((e, k) => { const d = Math.abs(k - i); e.className = 'ln' + (k === i ? ' cur' : d === 1 ? ' near' : ''); });
  const e = els[c]; if (!e) return;
  $('list').style.transform = `translateY(${$('view').clientHeight / 2 - (e.offsetTop + e.offsetHeight / 2)}px)`;
}

api.on('track', t => {
  reset(); lines = t.lines; off = 0;
  const kind = lines.length ? 'synced' : t.plain ? 'unsynced' : 'none';
  $('meta').textContent = `${t.artist} – ${t.title}  (${t.source}, ${kind})`;
  if (lines.length) { showMsg(''); build(); focusLine(-1); }
  else if (t.plain) { showMsg(''); $('plain').textContent = t.plain; $('plain').style.display = 'block'; }
  else showMsg('No lyrics found – press Ctrl+Alt+I to add them');
});
api.on('status', s => { reset(); $('meta').textContent = ''; showMsg(s); });
api.on('progress', p => { base = p.ms; at = performance.now(); playing = p.playing; });
api.on('locked', v => document.body.classList.toggle('unlocked', !v));
api.on('offset', d => { off += d; $('meta').textContent = `sync offset ${off} ms`; });
window.addEventListener('resize', () => { if (lines.length) focusLine(last); });
showMsg('Waiting for Spotify…');

(function frame() {
  if (lines.length) {
    const pos = base + (playing ? performance.now() - at : 0) + off;
    let i = -1;
    while (i + 1 < lines.length && lines[i + 1].t <= pos) i++;
    if (i !== last) { last = i; focusLine(i); }
  }
  requestAnimationFrame(frame);
})();
</script>
