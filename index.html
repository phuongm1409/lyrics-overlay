<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
<title>Lyrics Overlay</title>
<link rel="stylesheet" href="assets/fonts/lexend-deca.css">
<style>
  *, *::before, *::after { box-sizing: border-box }
  :root {
    --accent: #aaff00; --ink: #aba2c3; --panel: rgba(22,14,43,.86); --outline: rgba(183,160,232,.36);
    --muted: #cabfdf; --align: center; --font: 'Segoe UI'; --size: 36px; --weight: 700;
    --font-style: normal; --shadow: 0 2px 12px #120e1c; --radius: 17px; --dim: .85;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; color: #f6f1ff;
    font-family: 'Segoe UI',system-ui,sans-serif; }
  #shell { position: absolute; inset: 5px; display: flex; flex-direction: column; overflow: hidden;
    border-radius: var(--radius); background: var(--panel); outline: 1px solid var(--outline); outline-offset: -1px; }
  body.unlocked #shell { outline: 1px dashed var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 50px; flex: 0 0 50px; padding: 0 8px 0 16px; }
  .identity { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .identity img { width: 22px; height: 22px; flex: none; }
  #meta { font-family: 'Lexend Deca','Segoe UI',system-ui,sans-serif; font-size: 12px; font-weight: 600; color: #f0e8fc; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; text-shadow: var(--shadow); }
  #source { color: var(--muted); font-size: 11px; font-weight: 500; padding-inline-start: 5px; }
  .controls { display: flex; flex: none; gap: 3px; }
  .controls button { display: grid; place-items: center; width: 25px; height: 24px; padding: 0;
    border: 0; background: transparent; cursor: pointer; }
  .controls button:focus-visible { outline: 1px solid var(--accent); border-radius: 3px; }
  .controls button img { width: 12px; height: 12px; filter: invert(1); opacity: .82; pointer-events: none; }
  .controls button:hover img, .controls button:focus-visible img, #lock[aria-pressed="true"] img { opacity: 1; }
  body.unlocked #lock { cursor: move; touch-action: none; }
  #lyrics { flex: 1; display: grid; align-content: center; padding: 5px 24px 16px; gap: 7px; overflow-y: auto;
    scrollbar-width: thin; text-align: var(--align); }
  #active { font: var(--font-style) var(--weight) var(--size)/1.13 var(--font), 'Segoe UI', sans-serif;
    letter-spacing: -.035em; overflow-wrap: anywhere; }
  .sweep-line { display: inline-block; max-width: 100%; }
  .sweep-text { display: block; background: linear-gradient(90deg,var(--accent) var(--fill,0%),var(--ink) var(--fill,0%));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(var(--shadow)); }
  .context { color: var(--ink); opacity: var(--dim); font: var(--font-style) 500 max(12px,calc(var(--size)*.45))/1.25 var(--font),sans-serif;
    text-shadow: var(--shadow); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #message, #plain { color: var(--ink); font: 500 max(15px,calc(var(--size)*.55))/1.35 var(--font),sans-serif; text-shadow: var(--shadow); }
  #plain { white-space: pre-wrap; }
  #progress { height: 3px; flex: 0 0 3px; margin: 0 18px 12px; border-radius: 3px; background: rgba(195,183,221,.27); }
  #progress span { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 3px;
    transform-origin: left; transform: scaleX(0); }
  #notice { position: absolute; right: 14px; bottom: 10px; max-width: calc(100% - 28px);
    border: 1px solid #536737; border-radius: 6px; padding: 5px 9px; color: #d8ff9b;
    background: #221c2e; font-size: 12px; pointer-events: none; }
  [hidden] { display: none !important }
</style>
<div id="shell">
  <header class="top">
    <div class="identity">
      <img src="icon.svg" alt="">
      <div id="meta"><span id="track-label"></span><span id="source"></span></div>
    </div>
    <nav class="controls" aria-label="Overlay controls">
      <button id="lock" type="button" aria-label="Unlock overlay" title="Unlock overlay" aria-pressed="true"><img src="locked.svg" alt=""></button>
      <button id="upload" type="button" aria-label="Import timed lyrics" title="Import timed lyrics"><img src="upload.svg" alt=""></button>
      <button id="menu" type="button" aria-label="Settings" title="Settings"><img src="menu.svg" alt=""></button>
      <button id="close" type="button" aria-label="Hide or exit" title="Hide or exit"><img src="close.svg" alt=""></button>
    </nav>
  </header>
  <main id="lyrics">
    <div id="previous" class="context" hidden></div>
    <div id="active" hidden></div>
    <div id="next" class="context" hidden></div>
    <div id="plain" hidden></div>
    <div id="message" role="status">Waiting for Spotify…</div>
  </main>
  <div id="progress" aria-hidden="true" hidden><span></span></div>
</div>
<div id="notice" role="status" hidden></div>
<script src="overlay.js"></script>
</html>
